# Membangun APK Android dari kode ini. Jalan otomatis setiap ada perubahan di cabang utama,
# atau manual: tab Actions > "Bangun APK" > Run workflow.
# Hasilnya ada di tab Releases (file .apk, tinggal diunduh dan dipasang di HP).
name: Bangun APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Cara termudah dari HP: unggah satu berkas zip kode ke repo (tanpa diekstrak). Kalau repo berisi
      # kode biasa dan tidak ada zip, langkah ini dilewati.
      - name: Buka zip kode (jika ada)
        run: |
          # Kalau ada beberapa zip (GitHub memberi nama bonbon-pos-2.zip saat nama sama), yang bernomor paling besar dipakai.
          Z=$(ls bonbon-pos*.zip 2>/dev/null | awk '{n=0; if (match($0,/-[0-9]+\.zip$/)) n=substr($0,RSTART+1,RLENGTH-5); print n, $0}' | sort -n | tail -1 | cut -d' ' -f2- || true)
          if [ -z "$Z" ]; then Z=$(ls -t *.zip 2>/dev/null | head -1 || true); fi
          if [ -n "$Z" ]; then
            echo "Membuka $Z"
            unzip -oq "$Z" -x '.github/*'
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang paket aplikasi
        run: npm install

      # Plugin Capacitor (notifikasi, berkas, berbagi) harus TERCATAT di package.json agar ikut masuk ke APK
      # (jangan pakai --no-save). Kalau zip kode sudah mencatatnya, langkah ini tidak mengubah apa-apa.
      - name: Pastikan Capacitor terpasang dan tercatat
        run: npm install @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7 @capacitor/local-notifications@7 @capacitor/filesystem@7 @capacitor/share@7

      - name: Bangun aplikasi web
        run: npm run build

      - name: Buat proyek Android
        run: npx cap add android

      # Kunci tanda tangan APK disimpan di GitHub Secrets (Settings > Secrets and variables > Actions),
      # bukan di repo. Caranya ada di PANDUAN-APK.md bagian "Kunci tanda tangan".
      - name: Siapkan kunci tanda tangan dari Secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::Secret kunci tanda tangan belum diisi (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS). Ikuti PANDUAN-APK.md bagian Kunci tanda tangan."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > android/app/bonbon-release.keystore
          test -s android/app/bonbon-release.keystore

      - name: Sesuaikan proyek Android (izin, ikon, kunci tanda tangan)
        run: node scripts/android-patch.mjs
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Sinkronkan web ke Android
        run: npx cap sync android

      - name: Pastikan plugin Android ikut terpasang
        run: |
          for p in local-notifications filesystem share; do
            if ! grep -q "capacitor-$p" android/capacitor.settings.gradle; then
              echo "::error::Plugin capacitor-$p tidak ikut terpasang di proyek Android, APK akan kehilangan fitur itu."
              cat android/capacitor.settings.gradle
              exit 1
            fi
          done
          echo "Plugin notifikasi, berkas, dan berbagi terpasang."
          grep -n 'name="app_name"' android/app/src/main/res/values/strings.xml

      - name: Bangun APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Siapkan berkas
        run: cp android/app/build/outputs/apk/release/app-release.apk Bonbon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bonbon-APK
          path: Bonbon.apk

      - name: Terbitkan di Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" Bonbon.apk \
            --title "Bonbon APK #${{ github.run_number }}" \
            --notes "Unduh Bonbon.apk lalu pasang di HP Android. Pembaruan dipasang langsung di atas aplikasi lama, data tetap aman."
